name: End-to-end against production

# Daily, and by hand from the Actions tab: the same journeys, accessibility, and keyboard
# checks, against the live site. Each run makes two accounts and two demos and deletes them;
# a failure emails the owner, which also makes this the uptime check.
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://wearwise-rouge.vercel.app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Wake the server (the free plan sleeps when quiet)
        run: |
          for i in $(seq 1 30); do
            curl -fs --max-time 20 "$E2E_BASE_URL/api/v1/health" && exit 0
            sleep 5
          done
          exit 1
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-production-report
          path: frontend/playwright-report
          retention-days: 7
