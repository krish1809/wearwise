name: End-to-end against production

# Daily, and by hand from the Actions tab: the same journeys, accessibility, and keyboard
# checks, against the live site. Each run makes two accounts and two demos and deletes them;
# a failure emails the owner, which also makes this the uptime check.
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://wearwise-rouge.vercel.app
      API_URL: https://wearwise-api-kzj4.onrender.com
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # The free plan sleeps when quiet. While it wakes, requests through the site get 429 for a
      # while, so it is woken directly first, then checked through the site.
      - name: Wake the server directly
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 70 "$API_URL/api/v1/health" || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::The backend at $API_URL did not answer 200."
          exit 1
      - name: The site reaches it
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$E2E_BASE_URL/api/v1/health" || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$E2E_BASE_URL/api/v1/health never answered 200."
          exit 1
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-production-report
          path: frontend/playwright-report
          retention-days: 7
