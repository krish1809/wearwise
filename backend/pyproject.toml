[project]
name = "wearwise-backend"
version = "0.0.1"
description = "WearWise API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.112",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "langchain==1.4.3",
    "langchain-anthropic==1.7.5",
    "langchain-core==1.6.7",
    "langgraph==1.2.14",
    "langgraph-checkpoint-postgres==3.1.2",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.170.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-boto3[s3]>=1.43.112",
]

# The agent packages (D55), and every package they brought in, are held to releases at least
# two weeks old when they were added: a brand-new release is where a bad publish shows up
# first. Move the date on purpose when upgrading them.
[tool.uv.exclude-newer-package]
anthropic = "2026-10-07T00:00:00Z"
certifi = "2026-10-07T00:00:00Z"
jsonpatch = "2026-10-07T00:00:00Z"
langchain = "2026-10-07T00:00:00Z"
langchain-anthropic = "2026-10-07T00:00:00Z"
langchain-core = "2026-10-07T00:00:00Z"
langchain-protocol = "2026-10-07T00:00:00Z"
langgraph = "2026-10-07T00:00:00Z"
langgraph-checkpoint = "2026-10-07T00:00:00Z"
langgraph-checkpoint-postgres = "2026-10-07T00:00:00Z"
langgraph-prebuilt = "2026-10-07T00:00:00Z"
langgraph-sdk = "2026-10-07T00:00:00Z"
langsmith = "2026-10-07T00:00:00Z"
orjson = "2026-10-07T00:00:00Z"
ormsgpack = "2026-10-07T00:00:00Z"
tenacity = "2026-10-07T00:00:00Z"
uuid-utils = "2026-10-07T00:00:00Z"
xxhash = "2026-10-07T00:00:00Z"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The migrations folder is called alembic/ too; without this, imports of the library sort as ours.
known-third-party = ["alembic"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
# alembic/ is left out: the folder shares its name with the library and would shadow it.
files = ["app", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
