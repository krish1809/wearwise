# Render Blueprint for the WearWise API. Set up once in the Render dashboard: New > Blueprint,
# then pick this repository. Steps in docs/DEPLOYMENT.md.
services:
  - type: web
    name: wearwise-api
    runtime: python
    plan: free
    # Same region as the Neon database, so each query stays inside Singapore.
    region: singapore
    rootDir: backend
    # rootDir alone would deploy only for changes in backend/; the reference data lives in seed/.
    # Paths here are relative to the repository root.
    buildFilter:
      paths:
        - backend/**
        - seed/**
    buildCommand: uv sync --locked --no-dev
    # Free instances can't run a pre-deploy command, so migrations and the reference data load
    # just before the server starts. The agents' checkpoint tables follow the migrations: their
    # library makes them itself (D59). Housekeeping (expired demos and the like) runs then too:
    # the free server sleeps when idle, so it starts often. It never stops the start.
    # --proxy-headers: take the visitor's IP from X-Forwarded-For, for rate limits.
    startCommand: uv run --no-sync alembic upgrade head && uv run --no-sync python -m scripts.agent_setup && uv run --no-sync python -m scripts.seed_reference && uv run --no-sync python -m scripts.housekeeping && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    # Deploy a commit on main only after its CI checks pass.
    autoDeployTrigger: checksPass
    # No healthCheckPath on purpose: the health route queries the database, and frequent checks
    # would keep Neon awake and use up its free compute hours.
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: UV_VERSION
        value: 0.12.23
      # Marks the session cookie Secure (https only).
      - key: APP_ENV
        value: production
      # Neon's pooled connection string (the host contains -pooler).
      - key: DATABASE_URL
        sync: false
      # Neon's direct connection string, used only by migrations.
      - key: MIGRATION_DATABASE_URL
        sync: false
      # Photos go to a private Backblaze B2 bucket (M3). The API refuses to start in production
      # with local storage, since Render's disk is wiped on every deploy.
      - key: STORAGE_BACKEND
        value: s3
      # The rest come from the Backblaze account, so they're set in the dashboard. Bucket names
      # are shared by every Backblaze account, so even the name can't be fixed here.
      # s3.<region>.backblazeb2.com
      - key: S3_ENDPOINT_URL
        sync: false
      # The <region> part of the endpoint, such as eu-central-003.
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # The owner's page of counts (/admin) opens only for these accounts, comma-separated.
      - key: ADMIN_EMAILS
        sync: false
      # Email (M12): confirming an address and a new password. Until EMAIL_PROVIDER is resend,
      # with its key and sender, the app sends nothing and says email isn't set up yet.
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Until a domain is verified: only these addresses get email (your own).
      - key: EMAIL_ALLOWLIST
        sync: false
      # Signs unsubscribe and "not for me" links; the same value in GitHub's environment.
      - key: EMAIL_LINK_SECRET
        sync: false
      # For links in emails.
      - key: APP_URL
        value: https://wearwise-rouge.vercel.app
